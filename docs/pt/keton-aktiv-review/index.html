<script defer>
  (function() {
    console.log('Disclaimer script start');

    const disclaimerTexts = {
      'pt': {
        title: 'Aviso Importante:',
        text: 'Este artigo é uma <strong>análise independente baseada em pesquisa de mercado e relatos de consumidores</strong>. Não substitui avaliação médica. Antes de iniciar qualquer tratamento, consulte um profissional de saúde qualificado.'
      },
      'en': {
        title: 'Important Notice:',
        text: 'This article is an <strong>independent analysis based on market research and consumer reports</strong>. It does not replace a medical evaluation. Always consult a qualified health professional before starting any treatment.'
      }
      // adicione outros idiomas se quiser
    };

    function injectTopBanner() {
      console.log('Tentando inserir banner');
      if (localStorage.getItem('topBannerClosed')) {
        console.log('Banner já fechado anteriormente');
        return;
      }
      const banner = document.createElement('div');
      banner.id = 'topBannerFixed';
      banner.style.cssText = `
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background: #28a745;
        color: #fff;
        padding: 12px 18px;
        text-align: center;
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      `;
      banner.innerHTML = `
        <span style="margin-right: 12px; font-weight: 600;">Informações importantes sobre saúde e bem-estar.</span>
        <button id="closeBannerBtn" style="background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 14px;">Fechar</button>
      `;
      document.body.prepend(banner);
      document.body.style.paddingTop = '60px';
      document.getElementById('closeBannerBtn').addEventListener('click', () => {
        banner.remove();
        document.body.style.paddingTop = '0px';
        localStorage.setItem('topBannerClosed', '1');
        console.log('Banner fechado pelo usuário');
      });
      console.log('Banner inserido no DOM:', banner);
    }

    function injectDisclaimer() {
      console.log('Tentando inserir disclaimer');
      const h1 = document.querySelector('h1');
      console.log('H1 selecionado:', h1);
      if (!h1) {
        console.warn('Não encontrei H1 para inserir disclaimer');
        return;
      }

      const lang = (document.documentElement.lang || 'pt').toLowerCase().substring(0, 2);
      const content = disclaimerTexts[lang] || disclaimerTexts['pt'];
      console.log('Conteúdo do disclaimer para idioma', lang, content);

      const box = document.createElement('div');
      box.id = 'rnDisclaimerBox';
      box.style.cssText = `
        padding: 18px;
        background: #f1fdf4;
        border-left: 4px solid #28a745;
        border-radius: 4px;
        margin-top: 22px;
        font-family: 'Inter', sans-serif;
        color: #2d2d2d;
        line-height: 1.5;
      `;
      box.innerHTML = `<strong style="color:#1e7e34;">${content.title}</strong><p style="margin:6px 0 0 0;">${content.text}</p>`;
      h1.insertAdjacentElement('afterend', box);
      console.log('Disclaimer injetado após H1:', box);
    }

    // Quando o DOM estiver completamente carregado
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM carregado, executando injeções');
      injectTopBanner();
      injectDisclaimer();
    });
  })();
</script>
